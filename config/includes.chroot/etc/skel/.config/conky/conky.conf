conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'E8ECF5',
    draw_borders = true,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = true,
    double_buffer = true,
    gap_x = 16,
    gap_y = 54,
    minimum_width = 270,
    maximum_width = 270,
    own_window = true,
    own_window_argb_visual = true,
    own_window_argb_value = 175,
    own_window_type = 'dock',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2,
    use_xft = true,
    xftalpha = 0.9,
    font = 'DejaVu Sans:size=9',
};

conky.text = [[
${color #69D6FF}${font DejaVu Sans:bold:size=12}NOVALINUX  |  SYSTEM${font}${color}
${hr}
${color #A9B7CC}CPU${color}
${cpu}% ${cpubar 7}
${cpugraph 32,260 69D6FF 263449}
${color #A9B7CC}MEMORIA${color}
${mem} / ${memmax}  (${memperc}%)
${membar 7}
${color #A9B7CC}TEMPERATURAS${color}
${execi 5 python3 /usr/local/bin/novalinux-sensors.py}
${color #A9B7CC}DISCO RAÍZ${color}
${fs_used /} / ${fs_size /}  (${fs_used_perc /}%)
${fs_bar 7 /}
${color #A9B7CC}RED${color}
Descarga: ${downspeedf} KiB/s
Subida:   ${upspeedf} KiB/s
${downspeedgraph 24,260 69D6FF 263449}
${upspeedgraph 24,260 FF9D66 4A3028}
${color #7D8CA5}Los sensores dependen del firmware y del hardware.${color}
]];
