name: Construir NovaLinux Zenkai OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin

      - name: Validar configuración
        run: |
          test -f auto/config
          test -f config/package-lists/sistema-base.list.chroot
          test -f config/package-lists/escritorio.list.chroot
          chmod +x auto/config auto/clean auto/build

      - name: Configurar Live-Build
        run: sudo lb config

      - name: Construir ISO
        run: sudo lb build

      - name: Publicar ISO
        uses: actions/upload-artifact@v4
        with:
          name: NovaLinux-Zenkai-OS-Debian13-amd64
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
