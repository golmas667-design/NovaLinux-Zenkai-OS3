name: Construir NovaLinux Zenkai OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: novalinux-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Preparar directorios
        shell: bash
        run: |
          mkdir -p build-logs .cache/apt/archives/partial
          df -h

      - name: Validación previa de archivos y scripts
        shell: bash
        run: |
          set -euo pipefail
          test -s auto/config
          test -s config/package-lists/novalinux-completo.list.chroot
          test "$(find config/package-lists -maxdepth 1 -type f -name '*.list.chroot' | wc -l)" -eq 1
          grep -qx "linux-image-amd64" config/package-lists/novalinux-completo.list.chroot
          grep -qx "task-xfce-desktop" config/package-lists/novalinux-completo.list.chroot
          grep -qx "calamares" config/package-lists/novalinux-completo.list.chroot
          grep -qx "gamemode" config/package-lists/novalinux-completo.list.chroot
          grep -qx "mangohud" config/package-lists/novalinux-completo.list.chroot
          grep -qx "conky-all" config/package-lists/novalinux-completo.list.chroot
          test -s config/includes.chroot/etc/novalinux/conky.conf
          test -s config/includes.chroot/etc/skel/.config/conky/conky.conf
          test -s config/includes.chroot/etc/skel/.config/autostart/novalinux-monitor.desktop
          test -s config/includes.chroot/usr/local/bin/novalinux-sensors.py
          PYTHONPYCACHEPREFIX=/tmp/novalinux-pycache python3 -m py_compile config/includes.chroot/usr/local/bin/novalinux-sensors.py
          grep -qx "calamares-settings-debian" config/package-lists/novalinux-completo.list.chroot
          ! grep -q -- "--debian-installer live" auto/config
          sh -n auto/config
          sh -n auto/build
          sh -n auto/clean
          ! grep -RInE '^[[:space:]]*(sudo|apt|apt-get)[[:space:]]' config/package-lists
          ! grep -RInE '^[[:space:]]*[^#[:space:]][^[:space:]]*[[:space:]]' config/package-lists
          echo "Preflight correcto."

      - name: Construir dentro de Debian Trixie aislado
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$GITHUB_WORKSPACE/.cache/apt:/var/cache/apt/archives" \
            -w /work \
            debian:trixie bash -lc '
              set -Eeuo pipefail
              export DEBIAN_FRONTEND=noninteractive
              mkdir -p build-logs
              exec > >(tee -a build-logs/build.log) 2>&1
              for attempt in 1 2 3; do
                if apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update; then
                  break
                fi
                if [ "$attempt" -eq 3 ]; then
                  echo "ERROR: apt update falló tras 3 intentos."
                  exit 1
                fi
                sleep $((attempt * 15))
              done
              apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools \
                grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common
              chmod +x auto/config auto/build auto/clean
              lb config
              lb build
              shopt -s nullglob
              images=( *.iso )
              if [ "${#images[@]}" -eq 0 ]; then
                echo "ERROR: live-build terminó sin generar una ISO."
                exit 1
              fi
              for image in "${images[@]}"; do
                test -s "$image"
                sha256sum "$image" | tee "build-logs/${image}.sha256"
                xorriso -indev "$image" -toc
                xorriso -indev "$image" -report_el_torito plain | tee "build-logs/${image}.eltorito.txt"
                squashfs="/tmp/novalinux-filesystem.squashfs"
                rm -f "$squashfs"
                xorriso -osirrox on -indev "$image" -extract /live/filesystem.squashfs "$squashfs"
                unsquashfs -ll "$squashfs" > "build-logs/${image}.filesystem.txt"
                grep -Eq "usr/bin/calamares$" "build-logs/${image}.filesystem.txt"
                grep -q "calamares-install-debian.desktop" "build-logs/${image}.filesystem.txt"
                grep -Eq "etc/novalinux/conky.conf$" "build-logs/${image}.filesystem.txt"
                grep -Eq "usr/bin/conky$" "build-logs/${image}.filesystem.txt"
                grep -Eq "usr/bin/mangohud$" "build-logs/${image}.filesystem.txt"
                grep -Eq "usr/bin/gamemoded$" "build-logs/${image}.filesystem.txt"
                grep -Eq "usr/local/bin/novalinux-sensors.py$" "build-logs/${image}.filesystem.txt"
                echo "ISO verificada: contiene Calamares dentro del sistema Live."
              done
            '

      - name: Guardar ISO compilada
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: NovaLinux-Zenkai-OS-Debian13-amd64
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14

      - name: Guardar registros incluso si falla
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NovaLinux-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 30
