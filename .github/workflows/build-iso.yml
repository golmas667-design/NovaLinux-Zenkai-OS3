name: Build NovaLinux Zenkai OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools
      - name: Set executable scripts
        run: chmod +x auto/config auto/clean auto/build config/hooks/normal/*.hook.chroot
      - name: Configure and build
        run: |
          sudo lb config
          sudo lb build
      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          mapfile -t isos < <(find . -maxdepth 1 -type f -name '*.iso' -size +100M)
          test "${#isos[@]}" -eq 1
          file "${isos[0]}"
          sha256sum "${isos[0]}" | tee SHA256SUMS
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaLinux-Zenkai-OS-Debian13-amd64
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
