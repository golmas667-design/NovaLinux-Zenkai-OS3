name: Build NovaLinux Zenkai OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    name: Debian 13 Live ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian Live-Build and BIOS/UEFI boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
            isolinux syslinux-common

      - name: Validate scripts and package lists
        run: |
          set -eu
          test -s auto/config
          test -s auto/build
          test -s auto/clean
          test -s config/package-lists/sistema-base.list.chroot
          test -s config/package-lists/escritorio.list.chroot
          test -s config/package-lists/controladores-firmware.list.chroot
          test -s config/package-lists/herramientas-ia.list.chroot
          sh -n auto/config
          sh -n auto/build
          sh -n auto/clean
          sh -n config/hooks/normal/0100-zenkai-branding.hook.chroot

      - name: Configure Live-Build
        run: sudo lb config

      - name: Build complete ISO
        run: sudo lb build

      - name: Verify ISO and checksum
        run: |
          set -euo pipefail
          mapfile -t isos < <(find . -maxdepth 1 -type f -name '*.iso' -size +100M)
          if [ "${#isos[@]}" -ne 1 ]; then
            echo "Expected exactly one ISO larger than 100 MiB; found ${#isos[@]}."
            find . -maxdepth 2 -type f -name '*.iso' -printf '%p %s bytes\n' || true
            exit 1
          fi
          file "${isos[0]}"
          sha256sum "${isos[0]}" | tee SHA256SUMS

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NovaLinux-Zenkai-OS-Debian13-amd64
          path: |
            *.iso
            SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
